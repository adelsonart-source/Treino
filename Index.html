<title>Treino ABC</title>
<style>
:root{color-scheme:dark;--bg:#000;--card:#0d0d0d;--tx:#f2f2f2;--tx2:#8c948c;--bd:#1c2a1c;--ac:#39ff14;--acx:#000;--ok:#39ff14;--okbg:#0a2a07;--warn:#39ff14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.hero{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px}
.k{font-size:13px;color:var(--tx2)}
h1{font-size:26px;font-weight:500;margin:4px 0 2px;color:var(--ac);text-shadow:0 0 12px rgba(57,255,20,.45)}
.row{display:flex;align-items:center;gap:14px;margin-top:14px}
.tabs{display:flex;gap:8px;margin:16px 0}
.tb{flex:1;padding:12px 0;border:1px solid var(--bd);background:var(--card);border-radius:12px;font-size:16px;font-weight:500;color:var(--tx2)}
.tb.on{background:var(--ac);color:var(--acx);border-color:var(--ac);box-shadow:0 0 14px rgba(57,255,20,.5)}
.ex{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:500;font-size:16px}
.chip{font-size:13px;padding:3px 10px;border-radius:8px;background:var(--bg);color:var(--tx2);white-space:nowrap}
.sets{display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap}
.dot{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:transparent;font-size:16px;font-weight:500;color:var(--tx2)}
.dot.d{background:var(--okbg);border-color:var(--ok);color:var(--ok);box-shadow:0 0 10px rgba(57,255,20,.45)}
.hero,.ex,.timer{border-color:#1f3a1a}
.chip{background:#0a2a07;color:var(--ac)}
.btn{border-color:var(--ok);color:var(--ok)}
.kg{width:76px;height:44px;border:1px solid var(--bd);border-radius:10px;background:transparent;padding:0 8px;text-align:center;margin-left:auto}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px 14px;font-size:14px}
.warm{display:flex;align-items:center;gap:12px}
.timer{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-top:6px}
#tm{font-size:24px;font-weight:500;flex:1;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
<div class="hero">
<div class="k">Ficha de treino</div>
<h1 id="ot"></h1>
<div id="os" class="k"></div>
<div class="row">
<svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Progresso"><circle cx="32" cy="32" r="27" fill="none" stroke="var(--bd)" stroke-width="5"/><circle id="ring" cx="32" cy="32" r="27" fill="none" stroke="var(--ok)" stroke-width="5" stroke-linecap="round" stroke-dasharray="170" stroke-dashoffset="170" transform="rotate(-90 32 32)"/><text id="pct" x="32" y="37" text-anchor="middle" font-size="14" font-weight="500" fill="var(--tx)">0%</text></svg>
<div style="flex:1"><div id="cnt" style="font-weight:500"></div><div class="k">séries concluídas</div></div>
<button class="btn" id="reset">Zerar</button>
</div>
</div>
<div class="tabs"><button class="tb" data-t="A">Treino A</button><button class="tb" data-t="B">Treino B</button><button class="tb" data-t="C">Treino C</button></div>
<div class="ex warm"><div style="flex:1"><div class="nm" style="color:var(--warn)">Aquecimento inicial</div><div class="k">30 minutos</div></div><button class="btn" id="wb">Feito</button></div>
<div id="list"></div>
<div class="timer"><div><div class="k">Descanso</div></div><div id="tm">00:00</div><button class="btn rb" data-s="45">45s</button><button class="btn rb" data-s="60">60s</button><button class="btn rb" data-s="90">90s</button></div>
</main>
<script>
var D={A:{n:'Quadríceps e pernas',e:[['Cadeira extensora (unilateral)',4,'10'],['Passada frontal + agachamento',4,'10+10'],['Leg press 45°',4,'10+10'],['Hack machine + adutora',4,'10+10'],['Cadeira extensora (drop set)',4,'12-10-8'],['Agachamento articulado',4,'10'],['Flexão plantar (panturrilha)',4,'10']]},
B:{n:'Peito, costas, ombro e braços',e:[['Supino vertical + voador',4,'12'],['Remada dorsal + puxada pulley',4,'10'],['Desenvolvimento de ombro',4,'10'],['Tríceps',4,'10'],['Rosca bíceps alternada + direta',4,'12'],['Abdominal supra + infra',4,'15']]},
C:{n:'Glúteos e posteriores',e:[['Glúteos: elevação pélvica',4,'10'],['Glúteos: sumô',4,'10'],['Agachamento SQT (glúteos)',4,'10'],['Mesa flexora + stiff',4,'10+10'],['Cadeira flexora',4,'10+10'],['Cadeira abdutora',4,'10+10'],['Abdominal supra + infra',4,'15']]}};
var cur='A',S={A:{},B:{},C:{}},KG={},ti=null;
try{var s=JSON.parse(localStorage.getItem('abc_s')||'null');if(s)S=s;var g=JSON.parse(localStorage.getItem('abc_kg')||'null');if(g)KG=g;var c=localStorage.getItem('abc_cur');if(c&&D[c])cur=c}catch(e){}

document.getElementById('wb').textContent=S[cur].w?'Concluído':'Feito';
var h='';
D[cur].e.forEach(function(x,i){
h+='<div class="ex"><div class="top"><div class="nm">'+(i+1)+'. '+x[0]+'</div><span class="chip">'+x[1]+' x '+x[2]+'</span></div><div class="sets">';
for(var s=0;s<x[1];s++){var k=i+'_'+s;h+='<button class="dot'+(S[cur][k]?' d':'')+'" data-k="'+k+'" aria-label="Série '+(s+1)+'">'+(S[cur][k]?'✓':(s+1))+'</button>'}
h+='<input class="kg" inputmode="decimal" placeholder="kg" data-g="'+cur+i+'" value="'+(KG[cur+i]||'')+'" aria-label="Carga em kg"></div></div>'});
document.getElementById('list').innerHTML=h;upd();save();}
document.querySelectorAll('.tb').forEach(function(b){b.onclick=function(){cur=b.dataset.t;render()}});
document.getElementById('list').onclick=function(e){var b=e.target.closest('.dot');if(!b)return;var k=b.dataset.k;S[cur][k]=!S[cur][k];b.classList.toggle('d',S[cur][k]);b.textContent=S[cur][k]?'✓':(+k.split('_')[1]+1);upd();save();if(S[cur][k])rest(60)};
document.getElementById('list').oninput=function(e){if(e.target.dataset.g){KG[e.target.dataset.g]=e.target.value;save()}};
document.getElementById('wb').onclick=function(){S[cur].w=!S[cur].w;this.textContent=S[cur].w?'Concluído':'Feito';save()};
document.getElementById('reset').onclick=function(){S[cur]={};render()};
function rest(s){clearInterval(ti);var r=s;function show(){var m=Math.floor(r/60),q=r%60;document.getElementById('tm').textContent=(m<10?'0':'')+m+':'+(q<10?'0':'')+q}show();ti=setInterval(function(){r--;if(r<=0){clearInterval(ti);r=0;try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}show()},1000)}
document.querySelectorAll('.rb').forEach(function(b){b.onclick=function(){rest(+b.dataset.s)}});
render();
</script>
</body>
</html>
